name: mol-evo
channels:
  - conda-forge
  - defaults
dependencies:
  # Core scientific packages
  - python=3.10
  - rdkit
  - periodictable
  - seaborn
  - pymoo
  - numpy
  - pandas
  - matplotlib
  - scipy
  - h5py
  - scikit-learn

  # Docking dependencies for SmartCADD
  # NOTE: smina removed due to dependency conflicts - install separately
  - xtb          # Quantum mechanics for geometry optimization
  - openbabel    # Molecule format conversion (PDB <-> PDBQT)
  - pymol-open-source  # Visualization

  # Quantum chemistry (molecular)
  - pyscf
  - ase
  - dftbplus
  - dftd4
  - tblite
  - tblite-python
  # Quantum ESPRESSO periodic DFT (crystal bandgap, band structure, effective masses)
  # Install: conda install -n mol-evo -c conda-forge qe
  # Pseudopotentials: python -m quantum_chemistry.setup_pseudos --elements Si Ge Ga As N
  - qe

  # Other utilities
  - flask

  - pip:
    # Molecular embeddings (ChemBERTa-2 for CVT-MOME)
    - transformers
    - umap-learn
    # SELFIES molecular string encoding
    - selfies
    # CMA-MAE quality-diversity optimisation (GridArchive, EvolutionStrategyEmitter, Scheduler)
    - ribs
    # BigSMILES polymer genotype encoding and sampling
    - gbigsmiles
    # SLICES crystal genotype encoding and structure reconstruction
    - slices           # install with --no-deps (avoids tensorflow/m3gnet; we use CHGNet instead)
    - pymatgen         # crystal structure representation
    - smact            # element validity checking
    - chgnet           # PyTorch CHGNet for formation energy prediction (no DGL required)
    # PyTorch: install via pip to support both CPU and AMD ROCm (WSL)
    # CPU:   pip install torch
    # ROCm:  pip install torch --index-url https://download.pytorch.org/whl/rocm6.2
    - torch>=2.9
    - torch-geometric  # Graph neural network utilities (crystal property models)
    # ALIGNN + JARVIS pretrained models for SLICES superconductor Tc prediction (InvDesFlow)
    - alignn           # Atomistic Line Graph Neural Network
    - jarvis-tools     # JARVIS/NIST pretrained model infrastructure and structure converters
